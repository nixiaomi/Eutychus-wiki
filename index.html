<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小说世界观与章节 Wiki</title>
    <!-- FlexSearch 纯前端全文检索引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/flexsearch@0.7.31/dist/flexsearch.bundle.js"></script>
    <!-- 知识库数据 -->
    <script src="./knowledge.js"></script>
    <!-- 小说原文（由 update_novel.py 自动生成） -->
    <script src="./novel_texts.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-light: #818cf8;
            --accent: #f59e0b;
            --border: #334155;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 侧边栏及过渡动画 */
        .sidebar {
            width: 260px;
            background: #090d16;
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-shrink: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }
        /* 桌面端折叠 */
        .sidebar.collapsed {
            width: 0 !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
            border: none !important;
            opacity: 0;
            overflow: hidden;
        }
        .sidebar h2 {
            font-size: 1.2rem;
            color: var(--primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar .subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: -12px;
        }
        .nav-list { list-style: none; }
        .nav-item {
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            margin-bottom: 6px;
            transition: 0.2s;
            font-size: 0.95rem;
        }
        .nav-item:hover, .nav-item.active {
            background: var(--card-bg);
            color: var(--text-main);
        }

        /* 全局搜索框 */
        .sidebar-search {
            position: relative;
        }
        .sidebar-search input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            color: white;
            font-size: 0.85rem;
            outline: none;
            transition: 0.2s;
        }
        .sidebar-search input:focus {
            border-color: var(--primary);
        }
        .sidebar-search input::placeholder {
            color: #64748b;
        }

        /* 主内容区及顶部菜单栏 */
        .main-content {
            flex: 1;
            padding: 24px 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .menu-toggle {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.6rem;
            cursor: pointer;
            margin-right: 15px;
            border-radius: 6px;
            padding: 4px 10px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-toggle:hover { background: var(--card-bg); }

        /* ============== 密码进入门 ============== */
        .gate-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(160deg, #0f172a 0%, #090d16 60%, #0b1020 100%);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 28px;
            transition: opacity 0.5s ease;
        }
        .gate-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .gate-title {
            font-size: 1.8rem;
            color: var(--primary-light);
            font-weight: bold;
            letter-spacing: 2px;
        }
        .gate-sub {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: -20px;
            letter-spacing: 1px;
        }
        .gate-box {
            display: flex;
            gap: 10px;
        }
        .gate-input {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            width: 200px;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
            transition: 0.2s;
        }
        .gate-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(99,102,241,0.3);
        }
        .gate-btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 0 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        .gate-btn:hover { background: var(--primary-light); }
        .gate-error {
            color: var(--danger);
            font-size: 0.85rem;
            min-height: 20px;
        }

        /* 移动端遮罩层 */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 90;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.show { display: block; }

        .section { display: none; }
        .section.active { display: block; }

        .section > h2 {
            font-size: 1.4rem;
            margin-bottom: 8px;
        }
        /* 章节卡片：可点击 */
        #chapter-cards .card { cursor: pointer; }
        #chapter-cards .card:hover { border-color: var(--primary-light); transform: translateY(-2px); }

        /* 阅读器 */
        #reader .reader-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        #reader .back-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        #reader .back-btn:hover { background: var(--border); }
        #reader .reader-title {
            font-size: 1.4rem;
            color: var(--primary-light);
        }
        #reader .reader-content {
            max-width: 720px;
            margin: 0 auto;
            font-size: 1rem;
            line-height: 2;
            color: #cbd5e1;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .section > .section-desc {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 16px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: 0.2s;
        }
        .card:hover { border-color: var(--primary-light); }

        /* 搜索匹配高亮闪烁 */
        .card.flash-highlight {
            animation: borderFlash 1.2s ease-out;
        }
        @keyframes borderFlash {
            0%   { border-color: var(--accent); box-shadow: 0 0 16px rgba(245,158,11,0.5); }
            50%  { border-color: var(--accent); box-shadow: 0 0 24px rgba(245,158,11,0.7); }
            100% { border-color: var(--border); box-shadow: 0 0 0px rgba(245,158,11,0); }
        }

        .card h3 {
            color: var(--primary-light);
            margin-bottom: 10px;
            font-size: 1.05rem;
        }
        .card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* 章节卡片增强 */
        .card .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }
        .card .tag {
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 12px;
            background: rgba(99,102,241,0.18);
            color: var(--primary-light);
            white-space: nowrap;
        }
        .card .tag.char { background: rgba(245,158,11,0.18); color: var(--accent); }
        .card .tag.thread { background: rgba(34,197,94,0.18); color: #4ade80; }
        .card .tag.foreshadow { background: rgba(239,68,68,0.15); color: var(--danger); }

        .card .tag-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-right: 2px;
            display: inline-flex;
            align-items: center;
        }

        .card .first-appear {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 8px;
            font-style: italic;
        }

        /* 搜索结果高亮 */
        .search-highlight {
            background: rgba(245,158,11,0.35);
            padding: 1px 2px;
            border-radius: 2px;
        }

        /* 右下角 AI 助手悬浮框 */
        .ai-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(99,102,241,0.4);
            transition: 0.2s;
            z-index: 100;
        }
        .ai-fab:hover { background: var(--primary-light); transform: scale(1.05); }
        .ai-chat-window {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 420px;
            height: 540px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: none;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            z-index: 99;
        }
        .ai-chat-window.open { display: flex; }
        .chat-header {
            background: #090d16;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }
        .chat-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg { max-width: 88%; padding: 10px 14px; border-radius: 10px; font-size: 0.85rem; line-height: 1.55; }
        .msg.user { background: var(--primary); align-self: flex-end; color: white; }
        .msg.ai {
            background: #334155;
            align-self: flex-start;
            color: var(--text-main);
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.ai .result-item {
            border-left: 2px solid var(--primary-light);
            padding-left: 10px;
            margin: 6px 0;
            font-size: 0.82rem;
        }
        .msg.ai .result-item .ri-title { color: var(--primary-light); font-weight: bold; }
        .msg.ai .result-item .ri-text { color: #cbd5e1; margin-top: 2px; }
        .msg.ai .result-section {
            font-size: 0.75rem;
            color: #64748b;
            margin: 8px 0 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .chat-input-area {
            padding: 12px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }
        .chat-input {
            flex: 1;
            background: #090d16;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 0.85rem;
        }
        .chat-input:focus { border-color: var(--primary); }
        .send-btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .send-btn:hover { background: var(--primary-light); }

        /* ============== 手机端响应式适配 ============== */
        @media (max-width: 768px) {
            .main-content {
                padding: 16px 16px;
            }
            /* 侧边栏变为抽屉式菜单 */
            .sidebar {
                position: fixed;
                height: 100vh;
                left: -280px; /* 默认藏在屏幕左侧外 */
            }
            .sidebar.mobile-open {
                left: 0;
            }
            .sidebar-overlay.show {
                display: block;
            }
            /* 卡片网格单列 */
            .card-grid {
                grid-template-columns: 1fr;
            }
            /* AI聊天框适配小屏幕 */
            .ai-chat-window {
                width: calc(100% - 32px);
                right: 16px;
                bottom: 90px;
                height: 60vh;
            }
            .ai-fab {
                bottom: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
                font-size: 22px;
            }
            /* 阅读器适配 */
            #reader .reader-content {
                font-size: 0.95rem;
                line-height: 1.85;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- 密码进入门（防止他人随意浏览） -->
    <div class="gate-overlay" id="gateOverlay">
        <div class="gate-title">Eutychus</div>
        <div class="gate-sub">私人阅读空间</div>
        <div class="gate-box">
            <input type="password" class="gate-input" id="gateInput" placeholder="访问密码"
                   onkeydown="if(event.key==='Enter') unlockGate()" maxlength="32" autocomplete="off">
            <button class="gate-btn" onclick="unlockGate()">进入</button>
        </div>
        <div class="gate-error" id="gateError"></div>
    </div>

    <!-- 移动端侧边栏弹出时的遮罩层 -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- 侧边栏 -->
    <div class="sidebar" id="sidebar">
        <h2 id="novel-title">小说名称</h2>
        <div class="subtitle">轻量全文检索 Wiki</div>

        <!-- 全局搜索 -->
        <div class="sidebar-search">
            <input type="text" id="globalSearch" placeholder="🔍 搜索设定、角色、伏笔、原文..."
                   onkeydown="if(event.key==='Enter') doGlobalSearch()">
        </div>

        <ul class="nav-list">
            <li class="nav-item active" onclick="switchTab('world', event)">🌍 世界观与设定</li>
            <li class="nav-item" onclick="switchTab('characters', event)">👥 人物档案</li>
            <li class="nav-item" onclick="switchTab('chapters', event)">📖 章节目录</li>
        </ul>
    </div>

    <!-- 主体区域 -->
    <div class="main-content">
        <!-- 顶部汉堡按钮 -->
        <div class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()" title="展开/收起目录">☰</button>
        </div>

        <div id="world" class="section active">
            <h2>世界观与设定</h2>
            <p class="section-desc">神法、魔法、国家、组织……构建这个世界的所有核心设定。</p>
            <div class="card-grid" id="world-cards"></div>
        </div>

        <div id="characters" class="section">
            <h2>人物档案</h2>
            <p class="section-desc">所有已登场人物及其关系、能力与背景。</p>
            <div class="card-grid" id="char-cards"></div>
        </div>

        <div id="chapters" class="section">
            <h2>章节列表</h2>
            <p class="section-desc">每章的摘要、新增设定、人物与伏笔追踪。点击卡片进入阅读。</p>
            <div class="card-grid" id="chapter-cards"></div>
        </div>

        <div id="reader" class="section">
            <div class="reader-header">
                <button class="back-btn" onclick="closeReader()">← 返回目录</button>
                <span class="reader-title" id="reader-title"></span>
            </div>
            <div class="reader-content" id="reader-content"></div>
        </div>
    </div>

    <!-- 本地检索引擎小助手 -->
    <button class="ai-fab" onclick="toggleChat()" title="全文检索助手">🤖</button>
    <div class="ai-chat-window" id="chatWindow">
        <div class="chat-header">
            <span>📖 离线全文检索助手</span>
            <span style="cursor:pointer;" onclick="toggleChat()">✕</span>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="msg ai">你好！我是你的小说专属检索助手。你可以问我关于角色关系、世界观设定、伏笔暗线，也可以搜索小说原文中的具体情节或对话~</div>
        </div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="userInput" placeholder="搜索设定、角色、伏笔或原文..."
                   onkeydown="if(event.key==='Enter') sendMsg()">
            <button class="send-btn" onclick="sendMsg()">搜索</button>
        </div>
    </div>

    <script>
        // =========================================
        // 0. 密码进入门（本地纯前端验证，密码只以哈希存储）
        // =========================================

        // 纯 JS SHA-256 实现（file:// 环境 Web Crypto 不可用）
        const SHA256 = (function() {
            const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
            function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
            function toBytes(str) {
                const bytes = [];
                for (let i = 0; i < str.length; i++) {
                    let c = str.charCodeAt(i);
                    if (c < 0x80) bytes.push(c);
                    else if (c < 0x800) { bytes.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f)); }
                    else { bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f)); }
                }
                return bytes;
            }
            function sha256(str) {
                const msg = toBytes(str);
                const bitLen = msg.length * 8;
                msg.push(0x80);
                while (msg.length % 64 !== 56) msg.push(0);
                const lenHi = Math.floor(bitLen / 0x100000000);
                msg.push((lenHi >>> 24) & 0xff, (lenHi >>> 16) & 0xff, (lenHi >>> 8) & 0xff, lenHi & 0xff);
                msg.push((bitLen >>> 24) & 0xff, (bitLen >>> 16) & 0xff, (bitLen >>> 8) & 0xff, bitLen & 0xff);
                let h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
                for (let i = 0; i < msg.length; i += 64) {
                    const w = new Array(64);
                    for (let j = 0; j < 16; j++) w[j] = ((msg[i+j*4] << 24) | (msg[i+j*4+1] << 16) | (msg[i+j*4+2] << 8) | msg[i+j*4+3]) >>> 0;
                    for (let j = 16; j < 64; j++) {
                        const s0 = rotr(w[j-15], 7) ^ rotr(w[j-15], 18) ^ (w[j-15] >>> 3);
                        const s1 = rotr(w[j-2], 17) ^ rotr(w[j-2], 19) ^ (w[j-2] >>> 10);
                        w[j] = (w[j-16] + s0 + w[j-7] + s1) >>> 0;
                    }
                    let a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
                    for (let j = 0; j < 64; j++) {
                        const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
                        const ch = (e & f) ^ (~e & g);
                        const t1 = (hh + S1 + ch + K[j] + w[j]) >>> 0;
                        const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
                        const maj = (a & b) ^ (a & c) ^ (b & c);
                        const t2 = (S0 + maj) >>> 0;
                        hh = g; g = f; f = e; e = (d + t1) >>> 0;
                        d = c; c = b; b = a; a = (t1 + t2) >>> 0;
                    }
                    h[0] = (h[0] + a) >>> 0; h[1] = (h[1] + b) >>> 0; h[2] = (h[2] + c) >>> 0; h[3] = (h[3] + d) >>> 0;
                    h[4] = (h[4] + e) >>> 0; h[5] = (h[5] + f) >>> 0; h[6] = (h[6] + g) >>> 0; h[7] = (h[7] + hh) >>> 0;
                }
                let hex = '';
                for (let i = 0; i < 8; i++) {
                    hex += ((h[i] >>> 28) & 0xf).toString(16) + ((h[i] >>> 24) & 0xf).toString(16) +
                           ((h[i] >>> 20) & 0xf).toString(16) + ((h[i] >>> 16) & 0xf).toString(16) +
                           ((h[i] >>> 12) & 0xf).toString(16) + ((h[i] >>> 8) & 0xf).toString(16) +
                           ((h[i] >>> 4) & 0xf).toString(16) + (h[i] & 0xf).toString(16);
                }
                return hex;
            }
            return sha256;
        })();

        // 验证密码：只存哈希（盐已混入），源码中无明文密码
        const GATE_SALT = 'eutychus_vault';
        const GATE_HASH = '0ca4520e8f16986947e22febd90f11129e172208e99b05a6563bcf70b339265d';
        const UNLOCK_KEY = 'eutychus_unlocked';

        function unlockGate() {
            const input = document.getElementById('gateInput');
            const err = document.getElementById('gateError');
            const val = input.value.trim();
            if (!val) { err.innerText = '请输入访问密码'; return; }
            if (SHA256(GATE_SALT + ':' + val) === GATE_HASH) {
                // 密码正确：会话内记住解锁状态，刷新无需重输
                try { sessionStorage.setItem(UNLOCK_KEY, '1'); } catch(e) {}
                const overlay = document.getElementById('gateOverlay');
                overlay.classList.add('hidden');
                setTimeout(() => { overlay.style.display = 'none'; }, 500);
            } else {
                err.innerText = '密码错误，请重试';
                input.value = '';
                input.focus();
            }
        }

        // 页面加载时检查会话内是否已解锁
        (function initGate() {
            let unlocked = false;
            try { unlocked = sessionStorage.getItem(UNLOCK_KEY) === '1'; } catch(e) {}
            if (unlocked) {
                const overlay = document.getElementById('gateOverlay');
                overlay.classList.add('hidden');
                overlay.style.display = 'none';
            } else {
                document.getElementById('gateInput').focus();
            }
        })();

        // =========================================
        // 1. 初始化界面数据 (含防崩溃保护)
        // =========================================

        // 如果知识库/原文文件加载失败，提供默认空数据，防止页面卡死
        // 用内部变量名避免与外部脚本的 const 声明冲突；Array.isArray 强化类型检查
        var rawData = typeof novelData !== 'undefined' ? novelData : {};
        var _data = {
            title: rawData.title || "数据加载失败",
            world: Array.isArray(rawData.world) ? rawData.world : [],
            characters: Array.isArray(rawData.characters) ? rawData.characters : [],
            chapters: Array.isArray(rawData.chapters) ? rawData.chapters : []
        };
        var rawTexts = typeof novelTexts !== 'undefined' ? novelTexts : [];
        var _texts = Array.isArray(rawTexts) ? rawTexts : [];

        document.getElementById('novel-title').innerText = _data.title;

        // 世界观卡片
        function renderWorldCards(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="card">
                    <h3>${item.name}</h3>
                    <p>${item.desc}</p>
                    ${item.firstAppear ? `<div class="first-appear">📌 首次出现：${item.firstAppear}</div>` : ''}
                </div>
            `).join('');
        }

        // 人物卡片
        function renderCharCards(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(item => `
                <div class="card">
                    <h3>${item.name}</h3>
                    <p>${item.desc}</p>
                    ${item.aliases ? `<div class="first-appear">🏷 别名：${item.aliases.join('、')}</div>` : ''}
                    ${item.firstAppear ? `<div class="first-appear">📌 首次出现：${item.firstAppear}</div>` : ''}
                </div>
            `).join('');
        }

        // 章节卡片（增强版：显示新增设定/人物/支线/伏笔标签，点击进入阅读）
        function renderChapterCards(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map((item, idx) => {
                let tagHtml = '';
                if (item.newSettings && item.newSettings.length > 0) {
                    tagHtml += `<span class="tag-label">🆕设定:</span>`;
                    tagHtml += item.newSettings.slice(0, 4).map(s => `<span class="tag">${s}</span>`).join('');
                    if (item.newSettings.length > 4) tagHtml += `<span class="tag">+${item.newSettings.length - 4}项</span>`;
                }
                if (item.newCharacters && item.newCharacters.length > 0) {
                    tagHtml += `<span class="tag-label">👤新人物:</span>`;
                    tagHtml += item.newCharacters.slice(0, 3).map(c => `<span class="tag char">${c}</span>`).join('');
                    if (item.newCharacters.length > 3) tagHtml += `<span class="tag char">+${item.newCharacters.length - 3}人</span>`;
                }
                if (item.newThreads && item.newThreads.length > 0) {
                    tagHtml += `<span class="tag-label">📌新支线:</span>`;
                    tagHtml += item.newThreads.slice(0, 2).map(t => `<span class="tag thread">${t}</span>`).join('');
                    if (item.newThreads.length > 2) tagHtml += `<span class="tag thread">+${item.newThreads.length - 2}条</span>`;
                }
                if (item.foreshadowing && item.foreshadowing.length > 0) {
                    tagHtml += `<span class="tag-label">🔮伏笔:</span>`;
                    tagHtml += item.foreshadowing.slice(0, 2).map(f => `<span class="tag foreshadow">${f}</span>`).join('');
                    if (item.foreshadowing.length > 2) tagHtml += `<span class="tag foreshadow">+${item.foreshadowing.length - 2}条</span>`;
                }
                return `
                    <div class="card" onclick="openChapter(${idx})" title="点击阅读全文">
                        <h3>${item.title}</h3>
                        <p>${item.summary}</p>
                        ${tagHtml ? `<div class="meta-row">${tagHtml}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        renderWorldCards(_data.world, 'world-cards');
        renderCharCards(_data.characters, 'char-cards');
        renderChapterCards(_data.chapters, 'chapter-cards');

        // =========================================
        // 侧边栏交互控制（桌面折叠 / 手机抽屉）
        // =========================================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (window.innerWidth <= 768) {
                // 手机端：抽屉式滑出/收起
                sidebar.classList.toggle('mobile-open');
                overlay.classList.toggle('show');
            } else {
                // 桌面端：折叠/展开
                sidebar.classList.toggle('collapsed');
            }
        }

        // 标签切换
        function switchTab(tabId, event) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (event && event.target) {
                event.target.classList.add('active');
            } else {
                // 回退：根据 tabId 找到对应的 nav-item
                const items = document.querySelectorAll('.nav-item');
                const map = { world: 0, characters: 1, chapters: 2 };
                if (map[tabId] !== undefined && items[map[tabId]]) {
                    items[map[tabId]].classList.add('active');
                }
            }
            // 手机端：点击菜单项后自动收起侧边栏
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('mobile-open');
                document.getElementById('sidebarOverlay').classList.remove('show');
            }
        }

        // 打开章节阅读器
        function openChapter(idx) {
            if (!_texts || idx >= _texts.length) {
                alert('该章节原文暂未加载，请检查 novel_texts.js 是否最新。');
                return;
            }
            const ch = _texts[idx];
            document.getElementById('reader-title').innerText = ch.title;
            document.getElementById('reader-content').innerText = ch.text;

            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('reader').classList.add('active');
        }

        // 从阅读器返回目录
        function closeReader() {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById('chapters').classList.add('active');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            // 高亮"章节目录"导航项（第3个）
            const items = document.querySelectorAll('.nav-item');
            if (items[2]) items[2].classList.add('active');
        }

        function toggleChat() {
            const win = document.getElementById('chatWindow');
            win.classList.toggle('open');
            if (win.classList.contains('open')) {
                document.getElementById('userInput').focus();
            }
        }

        // =========================================
        // 2. 初始化 FlexSearch 全文检索引擎（中文适配版）
        // =========================================

        // 中文单字切分器：将字符串拆成单字数组，使 FlexSearch 支持中文检索
        const customEncode = function(str) {
            return typeof str === 'string' ? str.toLowerCase().split('') : [];
        };

        // 知识库索引
        const kbIndex = new FlexSearch.Document({
            tokenize: "full",
            encode: customEncode,
            document: {
                id: "id",
                index: ["title", "content", "extras"]
            }
        });

        // 小说原文索引
        const textIndex = new FlexSearch.Document({
            tokenize: "full",
            encode: customEncode,
            document: {
                id: "id",
                index: ["title", "content"]
            }
        });

        // ---- 索引知识库 ----
        let docId = 0;
        const allDocs = [];  // id -> {title, content, type, source}

        // 世界观
        _data.world.forEach(item => {
            const doc = { id: docId++, title: item.name, content: item.desc, extras: item.desc, type: 'world' };
            allDocs.push(doc);
            kbIndex.add(doc);
        });

        // 人物
        _data.characters.forEach(item => {
            const extras = [item.desc, ...(item.aliases || [])].join(' ');
            const doc = { id: docId++, title: item.name, content: item.desc, extras: extras, type: 'character' };
            allDocs.push(doc);
            kbIndex.add(doc);
        });

        // 章节知识
        _data.chapters.forEach(item => {
            const extras = [
                item.summary || '',
                ...(item.newSettings || []),
                ...(item.newCharacters || []),
                ...(item.newThreads || []),
                ...(item.foreshadowing || [])
            ].join(' ');
            const doc = {
                id: docId++,
                title: item.title,
                content: item.summary || '',
                extras: extras,
                type: 'chapter'
            };
            allDocs.push(doc);
            kbIndex.add(doc);
        });

        // ---- 索引小说原文 ----
        const chapterStartId = docId;  // 记录原文起始 ID
        if (_texts.length > 0) {
            _texts.forEach(ch => {
                const doc = {
                    id: docId++,
                    title: ch.title,
                    content: ch.text,
                    type: 'novel_text'
                };
                allDocs.push(doc);
                textIndex.add(doc);
            });
        }

        // =========================================
        // 3. 搜索函数（绕过 FlexSearch 内部存储，按 ID 从 allDocs 取原文）
        // =========================================

        function searchAll(query) {
            const kbResults = kbIndex.search(query, { enrich: true, limit: 8 });
            const textResults = (_texts.length > 0)
                ? textIndex.search(query, { enrich: true, limit: 5 })
                : [];

            // 合并去重知识库结果
            const seenIds = new Set();
            const kbMatches = [];
            kbResults.forEach(fieldResult => {
                (fieldResult.result || []).forEach(r => {
                    // 兼容 FlexSearch 返回对象或直接返回 ID 的情况
                    const id = typeof r === 'object' ? r.id : r;
                    if (id !== undefined && !seenIds.has(id)) {
                        seenIds.add(id);
                        kbMatches.push(allDocs[id]); // 从全局数组直接取原文，不依赖引擎内部存储
                    }
                });
            });

            // 合并去重原文结果
            const seenTextIds = new Set();
            const textMatches = [];
            textResults.forEach(fieldResult => {
                (fieldResult.result || []).forEach(r => {
                    const id = typeof r === 'object' ? r.id : r;
                    if (id !== undefined && !seenTextIds.has(id)) {
                        seenTextIds.add(id);
                        textMatches.push(allDocs[id]);
                    }
                });
            });

            return { kb: kbMatches.slice(0, 5), text: textMatches.slice(0, 3) };
        }

        // 从原文中提取包含关键词的摘录片段
        function extractSnippet(text, query, contextLen) {
            if (!text) return "无文本内容"; // 最后防线：防止 undefined 引发崩溃
            contextLen = contextLen || 60;
            const idx = text.toLowerCase().indexOf(query.toLowerCase());
            if (idx === -1) {
                // 尝试找任意包含的字符
                for (let i = 0; i < query.length; i++) {
                    const subIdx = text.indexOf(query[i]);
                    if (subIdx !== -1) {
                        const start = Math.max(0, subIdx - contextLen);
                        const end = Math.min(text.length, subIdx + contextLen);
                        let snippet = (start > 0 ? '…' : '') + text.substring(start, end) + (end < text.length ? '…' : '');
                        return snippet;
                    }
                }
                return text.substring(0, contextLen * 2) + '…';
            }
            const start = Math.max(0, idx - contextLen);
            const end = Math.min(text.length, idx + query.length + contextLen);
            let snippet = (start > 0 ? '…' : '') + text.substring(start, end) + (end < text.length ? '…' : '');
            return snippet;
        }

        // =========================================
        // 4. 全局搜索 + AI 助手对话
        // =========================================

        function doGlobalSearch() {
            const input = document.getElementById('globalSearch');
            const query = input.value.trim();
            if (!query) return;

            const results = searchAll(query);

            // 跳转到第一个有结果的 tab
            if (results.kb.length > 0) {
                const firstMatch = results.kb[0];
                if (firstMatch.type === 'world') {
                    switchTab('world');
                } else if (firstMatch.type === 'character') {
                    switchTab('characters');
                } else {
                    switchTab('chapters');
                }
            }

            // 高亮闪烁匹配到的卡片
            highlightMatchedCards(results);

            // 手机端：搜索后自动收起侧边栏，方便看结果
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('mobile-open');
                document.getElementById('sidebarOverlay').classList.remove('show');
            }

            // 同时在聊天窗口中显示详细结果
            showSearchResults(query, results);
        }

        function highlightMatchedCards(results) {
            // 收集所有匹配结果的标题
            const matchTitles = new Set();
            results.kb.forEach(doc => {
                if (doc && doc.title) matchTitles.add(doc.title);
            });
            results.text.forEach(doc => {
                if (doc && doc.title) matchTitles.add(doc.title);
            });

            // 在当前活跃区域中找对应卡片并闪烁
            const activeSection = document.querySelector('.section.active');
            if (!activeSection || matchTitles.size === 0) return;

            const cards = activeSection.querySelectorAll('.card');
            cards.forEach(card => {
                const h3 = card.querySelector('h3');
                if (h3 && matchTitles.has(h3.textContent.trim())) {
                    // 移除旧动画（如果存在），强制重排后重新触发
                    card.classList.remove('flash-highlight');
                    void card.offsetWidth; // 强制重排
                    card.classList.add('flash-highlight');
                    // 动画结束后自动清理
                    card.addEventListener('animationend', function handler() {
                        card.classList.remove('flash-highlight');
                        card.removeEventListener('animationend', handler);
                    });
                }
            });
        }

        function sendMsg() {
            const input = document.getElementById('userInput');
            const query = input.value.trim();
            if (!query) return;

            addMsg(query, 'user');
            input.value = '';

            const results = searchAll(query);
            showSearchResults(query, results);
        }

        function showSearchResults(query, results) {
            const { kb, text } = results;
            let reply = '';

            if (kb.length === 0 && text.length === 0) {
                reply = '😕 在当前知识库和已发布章节中，未检索到与 "' + query + '" 相关的内容。\n\n可以试试：\n• 用角色名搜索（如"娅儿"、"迪乌斯"）\n• 用设定关键词搜索（如"神识"、"魔法石"）\n• 搜索具体情节（如"隧道"、"决斗"）';
            } else {
                if (kb.length > 0) {
                    reply += '📚 **知识库匹配** (' + kb.length + '条)\n';
                    kb.forEach(doc => {
                        const typeLabel = doc.type === 'world' ? '🌍设定' :
                                         doc.type === 'character' ? '👤人物' : '📖章节';
                        reply += '  ┌ ' + typeLabel + ' **' + doc.title + '**\n';
                        reply += '  └ ' + (doc.content || '').substring(0, 120) + '…\n\n';
                    });
                }
                if (text.length > 0) {
                    reply += '📝 **原文摘录** (' + text.length + '条)\n';
                    text.forEach(doc => {
                        const snippet = extractSnippet(doc.content, query, 50);
                        reply += '  ┌ 📄 ' + doc.title + '\n';
                        reply += '  └ ' + snippet + '\n\n';
                    });
                }
            }

            addMsg(reply, 'ai');
        }

        function addMsg(text, role) {
            const body = document.getElementById('chatBody');
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.innerText = text;
            body.appendChild(div);
            body.scrollTop = body.scrollHeight;
        }
    </script>
</body>
